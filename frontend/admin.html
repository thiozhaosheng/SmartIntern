<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <title>SmartIntern - Admin</title>
  </head>

  <body class="min-h-screen bg-slate-50">
    <!-- ========================= -->
    <!-- Top Navigation Bar -->
    <!-- ========================= -->
    <div class="bg-white border-b">
      <div
        class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between"
      >
        <!-- Logo -->
        <div class="flex items-center gap-3">
          <div
            class="w-10 h-10 rounded-2xl bg-black text-white flex items-center justify-center font-semibold shadow-sm"
          >
            SI
          </div>
          <div>
            <div class="font-semibold text-slate-900">SmartIntern</div>
            <div class="text-xs text-slate-500">Admin Portal</div>
          </div>
        </div>

        <!-- Admin info + Logout -->
        <div class="flex items-center gap-3">
          <div class="hidden sm:block text-right">
            <div id="userName" class="text-sm font-medium text-slate-900">
              Loading...
            </div>
            <div id="userLoginId" class="text-xs text-slate-500"></div>
          </div>

          <button
            id="btnLogout"
            class="px-4 py-2 rounded-lg bg-black text-white hover:opacity-90 text-sm"
          >
            Logout
          </button>
        </div>
      </div>
    </div>

    <!-- ========================= -->
    <!-- Main Content -->
    <!-- ========================= -->
    <div class="max-w-6xl mx-auto px-6 py-6 space-y-4">
      <!-- Page Header -->
      <div>
        <h1 class="text-2xl font-semibold text-slate-900">Admin Dashboard</h1>
        <p class="text-sm text-slate-600">
          Create company/student accounts and manage platform data.
        </p>
      </div>

      <!-- ========================= -->
      <!-- Dashboard Stats -->
      <!-- ========================= -->
      <div class="bg-white rounded-2xl border p-4">
        <div class="flex items-center justify-between">
          <div class="text-sm font-semibold text-slate-900">
            Dashboard Stats
          </div>
          <div id="statsMsg" class="text-sm text-slate-500"></div>
        </div>

        <div class="mt-3 grid grid-cols-2 md:grid-cols-4 gap-3">
          <div class="border rounded-xl p-3">
            <div class="text-xs text-slate-500">Users</div>
            <div id="statUsers" class="text-2xl font-semibold">0</div>
          </div>

          <div class="border rounded-xl p-3">
            <div class="text-xs text-slate-500">Companies</div>
            <div id="statCompanies" class="text-2xl font-semibold">0</div>
          </div>

          <div class="border rounded-xl p-3">
            <div class="text-xs text-slate-500">Listings</div>
            <div id="statListings" class="text-2xl font-semibold">0</div>
          </div>

          <div class="border rounded-xl p-3">
            <div class="text-xs text-slate-500">Applications</div>
            <div id="statApplications" class="text-2xl font-semibold">0</div>
          </div>
        </div>
      </div>

      <!-- ========================= -->
      <!-- Main Grid -->
      <!-- ========================= -->
      <div class="grid grid-cols-1 lg:grid-cols-5 gap-4">
        <!-- ========================= -->
        <!-- Create Account Section -->
        <!-- ========================= -->
        <section class="lg:col-span-2">
          <div class="bg-white rounded-2xl border p-4">
            <div class="text-sm font-semibold text-slate-900 mb-3">
              Create account
            </div>

            <label class="text-sm font-medium text-slate-900">Role</label>
            <select
              id="role"
              class="mt-2 w-full border rounded-xl px-3 py-2 text-sm bg-white"
            >
              <option value="student">Student</option>
              <option value="company">Company</option>
            </select>

            <div class="mt-3 space-y-3">
              <div>
                <label class="text-sm font-medium text-slate-900"
                  >Full Name</label
                >
                <input
                  id="fullName"
                  class="mt-2 w-full border rounded-xl px-3 py-2 text-sm bg-white"
                />
              </div>

              <div>
                <label class="text-sm font-medium text-slate-900">Email</label>
                <input
                  id="email"
                  type="email"
                  class="mt-2 w-full border rounded-xl px-3 py-2 text-sm bg-white"
                />
              </div>

              <div>
                <label class="text-sm font-medium text-slate-900"
                  >Password</label
                >
                <input
                  id="password"
                  type="password"
                  class="mt-2 w-full border rounded-xl px-3 py-2 text-sm bg-white"
                />
              </div>
            </div>

            <!-- Company-only fields -->
            <div id="companyFields" class="mt-4 hidden border-t pt-4 space-y-3">
              <div class="text-sm font-semibold text-slate-900">
                Company Info
              </div>

              <input
                id="companyName"
                placeholder="Company Name"
                class="w-full border rounded-xl px-3 py-2 text-sm bg-white"
              />

              <input
                id="industry"
                placeholder="Industry"
                class="w-full border rounded-xl px-3 py-2 text-sm bg-white"
              />

              <input
                id="companyLocation"
                placeholder="Location"
                class="w-full border rounded-xl px-3 py-2 text-sm bg-white"
              />
            </div>

            <div id="createMsg" class="mt-3 text-sm text-slate-600"></div>

            <button
              id="btnCreate"
              class="mt-4 w-full px-4 py-2 rounded-lg bg-black text-white hover:opacity-90 text-sm"
            >
              Create account
            </button>
          </div>
        </section>

        <!-- ========================= -->
        <!-- Users + Companies Section -->
        <!-- ========================= -->
        <section class="lg:col-span-3 space-y-4">
          <!-- Users -->
          <div class="bg-white rounded-2xl border p-4">
            <div class="flex items-center justify-between">
              <div class="text-sm font-semibold text-slate-900">Users</div>
              <button
                id="btnRefreshUsers"
                class="text-sm text-slate-600 hover:text-slate-900"
              >
                Refresh
              </button>
            </div>

            <div id="usersMsg" class="text-sm text-slate-600 mt-2"></div>
            <div id="usersList" class="space-y-2 mt-3"></div>
          </div>

          <!-- Companies -->
          <div class="bg-white rounded-2xl border p-4">
            <div class="flex items-center justify-between">
              <div class="text-sm font-semibold text-slate-900">Companies</div>
              <button
                id="btnRefreshCompanies"
                class="text-sm text-slate-600 hover:text-slate-900"
              >
                Refresh
              </button>
            </div>

            <div id="companiesMsg" class="text-sm text-slate-600 mt-2"></div>
            <div id="companiesList" class="space-y-2 mt-3"></div>
          </div>
        </section>
      </div>
    </div>

    <script type="module" src="./assets/js/admin.js"></script>
  </body>
</html>
